
name: Generate Magazine Index

on:
  push:
    paths:
      - 'Ten10_auto_issue*/**'
      - '.github/workflows/generate-magazine-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main branch
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Generate magazine-index.json
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const root = process.cwd();

          const folders = fs.readdirSync(root, { withFileTypes: true })
            .filter(entry =>
              entry.isDirectory() &&
              /^Ten10_auto_issue\d+$/i.test(entry.name)
            )
            .map(entry => ({
              name: entry.name,
              number: Number(entry.name.match(/\d+$/)[0])
            }))
            .sort((a, b) => a.number - b.number);

          const issues = folders.map(folder => {
            const folderPath = path.join(root, folder.name);
            const files = fs.readdirSync(folderPath);

            const coverPattern = new RegExp(
              `^Ten10_Magazine_n${folder.number}_cover\\.(jpg|jpeg|png|webp)$`,
              'i'
            );

            const pagePattern = new RegExp(
              `^Ten10_Magazine_n${folder.number}_page_(\\d+)\\.(jpg|jpeg|png|webp)$`,
              'i'
            );

            const cover = files.find(file => coverPattern.test(file));

            const pages = files
              .map(file => {
                const match = file.match(pagePattern);
                return match
                  ? { filename: file, number: Number(match[1]) }
                  : null;
              })
              .filter(Boolean)
              .sort((a, b) => a.number - b.number)
              .map(page => page.filename);

            if (!cover) {
              console.warn(
                `WARNING: No cover found for issue ${folder.number}`
              );
            }

            return {
              number: folder.number,
              folder: folder.name,
              cover: cover || null,
              pages
            };
          });

          const output = JSON.stringify({ issues }, null, 2) + '\n';

          fs.writeFileSync(
            path.join(root, 'magazine-index.json'),
            output
          );

          console.log(`Generated index for ${issues.length} issues.`);
          NODE

      - name: Commit and push updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add magazine-index.json

          if git diff --cached --quiet; then
            echo "Magazine index is already up to date."
            exit 0
          fi

          git commit -m "Automatically update magazine index"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Magazine index successfully published."
              exit 0
            fi

            echo "Push failed. Synchronizing with main (attempt $attempt of 3)..."
            git fetch origin main
            git reset --hard origin/main

            node <<'NODE'
            const fs = require('fs');
            const path = require('path');

            const root = process.cwd();

            const folders = fs.readdirSync(root, { withFileTypes: true })
              .filter(entry =>
                entry.isDirectory() &&
                /^Ten10_auto_issue\d+$/i.test(entry.name)
              )
              .map(entry => ({
                name: entry.name,
                number: Number(entry.name.match(/\d+$/)[0])
              }))
              .sort((a, b) => a.number - b.number);

            const issues = folders.map(folder => {
              const files = fs.readdirSync(path.join(root, folder.name));

              const coverPattern = new RegExp(
                `^Ten10_Magazine_n${folder.number}_cover\\.(jpg|jpeg|png|webp)$`,
                'i'
              );

              const pagePattern = new RegExp(
                `^Ten10_Magazine_n${folder.number}_page_(\\d+)\\.(jpg|jpeg|png|webp)$`,
                'i'
              );

              const cover = files.find(file => coverPattern.test(file));

              const pages = files
                .map(file => {
                  const match = file.match(pagePattern);
                  return match
                    ? { filename: file, number: Number(match[1]) }
                    : null;
                })
                .filter(Boolean)
                .sort((a, b) => a.number - b.number)
                .map(page => page.filename);

              if (!cover) {
                console.warn(`WARNING: No cover found for issue ${folder.number}`);
              }

              return {
                number: folder.number,
                folder: folder.name,
                cover: cover || null,
                pages
              };
            });

            fs.writeFileSync(
              path.join(root, 'magazine-index.json'),
              JSON.stringify({ issues }, null, 2) + '\n'
            );
            NODE

            git add magazine-index.json

            if git diff --cached --quiet; then
              echo "Index is already up to date on main."
              exit 0
            fi

            git commit -m "Retry magazine index update"
          done

          echo "ERROR: Could not push magazine index after 3 attempts."
          exit 1
